<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Notebook user guide</title>
<link rel="stylesheet" href="/style.css">
<style>
  main { max-width: 46rem; }
  h1:focus, h2:focus, h3:focus { outline: 3px solid var(--accent); outline-offset: 4px; }
  h2 { border-top: 2px solid var(--line); padding-top: 1rem; margin-top: 2.5rem; }
  h3 { border-top: 0; padding-top: 0; margin-top: 1.75rem; }
  li { margin: 0.3rem 0; }
  code { font-family: Consolas, "Cascadia Mono", monospace; font-size: 0.9em; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 0 0.2em; }
  pre { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 0.75rem; overflow-x: auto; }
  pre code { border: 0; padding: 0; background: none; }
  a { color: var(--accent); }
  nav ul { columns: 2 18rem; }
</style>
<script type="module" src="/guide.js"></script>
</head>
<body>
<main id="guide"></main>
</body>
</html>
